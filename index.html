<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Venta de Garaje</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>Venta de Garaje</h1>
    <p class="subtitle">¡Todo debe irse! Precios y detalles muy pronto.</p>
  </header>

  <main>
    <p class="item-count" id="item-count"></p>
    <ul class="item-grid" id="item-grid"></ul>
  </main>

  <dialog class="viewer" id="viewer" aria-label="Visor de fotos">
    <button type="button" class="viewer-close" id="viewer-close" aria-label="Cerrar">&times;</button>
    <figure>
      <img id="viewer-image" alt="">
      <figcaption id="viewer-caption"></figcaption>
    </figure>
    <button type="button" class="viewer-nav viewer-prev" id="viewer-prev" aria-label="Foto anterior">&#8249;</button>
    <button type="button" class="viewer-nav viewer-next" id="viewer-next" aria-label="Foto siguiente">&#8250;</button>
  </dialog>

  <footer class="site-footer">
    <p>Datos de contacto muy pronto.</p>
  </footer>

  <script src="items.js"></script>
  <script src="app.js"></script>
</body>
</html>
